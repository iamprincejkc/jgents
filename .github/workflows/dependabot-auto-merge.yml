name: Dependabot auto-merge

# Habilita o auto-merge nos PRs do Dependabot: o PR só entra depois que o job
# `verificar` (ci.yml) passa, como exige o ruleset da branch main.
# Atualizações major ficam de fora e continuam sendo revisadas à mão.
on: pull_request

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Metadados da atualização
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Habilitar auto-merge (patch e minor)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
